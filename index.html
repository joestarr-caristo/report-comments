<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Report Comment Selector</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f3f5f8;
      --panel: #ffffff;
      --border: #d7dce3;
      --text: #1f2937;
      --muted: #6b7280;
      --blue: #2563eb;
      --blue-soft: #e8f0ff;
      --red: #b00020;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: var(--bg);
      color: var(--text);
    }

    h1, h2 { margin-bottom: 8px; }

    .layout {
      display: grid;
      grid-template-columns: minmax(900px, 1.8fr) minmax(500px, 1fr);
      gap: 32px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .search-box {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
    }

    .sticky-tools {
      position: sticky;
      top: 0;
      background: white;
      z-index: 5;
      padding-bottom: 10px;
    }

    .selected-count {
      margin-bottom: 8px;
      font-weight: bold;
    }

    .warning-box {
      color: var(--red);
      font-weight: bold;
      margin-bottom: 12px;
      min-height: 20px;
    }

    .comment-list {
      border: 1px solid var(--border);
      padding: 12px;
      max-height: calc(100vh - 250px);
      overflow-y: auto;
      background: #fafafa;
      border-radius: 10px;
    }

    .category {
      font-weight: bold;
      font-size: 18px;
      margin-top: 18px;
      margin-bottom: 8px;
      padding: 12px;
      background: #e9edf3;
      border-left: 6px solid #64748b;
      cursor: pointer;
      position: sticky;
      top: 0;
      z-index: 2;
      border-radius: 8px;
    }

    .category:hover { background: #dde3ec; }

    .category::before { content: "▼ "; }
    .category.collapsed::before { content: "▶ "; }

    .subcategory {
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
      margin-bottom: 6px;
      padding: 10px 12px;
      background: #f1f5f9;
      border-left: 5px solid #94a3b8;
      cursor: pointer;
      border-radius: 8px;
    }

    .subcategory:hover { background: #e5eaf0; }

    .subcategory::before { content: "▼ "; }
    .subcategory.collapsed::before { content: "▶ "; }

    .comment-item {
      margin-bottom: 12px;
      padding: 14px;
      line-height: 1.45;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.05);
    }

    .comment-item:hover {
      background: #f8fbff;
      border-color: #b7c7ee;
    }

    .comment-item.selected {
      background: var(--blue-soft);
      border-color: var(--blue);
    }

    .comment-header {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .comment-item input[type="checkbox"] {
      transform: scale(1.25);
      margin-top: 3px;
    }

    .comment-text { flex: 1; }

    mark {
      background: #fff2a8;
      padding: 0 2px;
      border-radius: 3px;
    }

    .dropdown-input {
      margin: 0 4px;
      font-size: 15px;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #aaa;
      min-width: 180px;
    }

    .missing-selection {
      border: 2px solid var(--red) !important;
      background: #fff2f2;
    }

    textarea {
      width: 100%;
      height: 220px;
      margin-bottom: 8px;
      font-size: 15px;
      padding: 10px;
      line-height: 1.4;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    button {
      padding: 8px 12px;
      margin-bottom: 18px;
      cursor: pointer;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
    }

    button:hover { background: #f3f4f6; }

    .selected-panel {
      margin-bottom: 18px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafafa;
    }

    .selected-review-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 8px;
      margin-bottom: 6px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: grab;
    }

    .selected-review-item span {
      flex: 1;
      font-size: 14px;
      line-height: 1.4;
    }

    .remove-selected {
      color: var(--red);
      font-weight: bold;
      cursor: pointer;
      border: none;
      background: transparent;
      margin: 0;
      padding: 2px 6px;
    }

    .language-options {
      margin: 18px 0;
      padding: 14px;
      border: 1px solid var(--border);
      background: #fafafa;
      border-radius: 10px;
    }

    .language-options label {
      display: inline-block;
      margin-right: 18px;
      margin-top: 10px;
      font-size: 16px;
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>

  <h1>Report Comment Selector</h1>

  <datalist id="vesselOptions"></datalist>
  <datalist id="segmentOptions"></datalist>

  <div class="layout">

    <section class="panel">
      <h2>Report comments</h2>

      <div class="sticky-tools">
        <input type="text" id="searchBox" class="search-box" placeholder="Search comments...">
        <div id="selectedCount" class="selected-count">Selected comments: 0</div>
        <div id="warningBox" class="warning-box"></div>
      </div>

      <div id="commentList" class="comment-list">Loading comments...</div>
    </section>

    <section class="panel">
      <div class="selected-panel">
        <h2>Selected comments</h2>
        <div id="selectedReview">No comments selected.</div>
      </div>

      <h2>English (UK) combined comments</h2>
      <textarea id="englishOutput" readonly></textarea>
      <button onclick="copyText('englishOutput')">Copy English</button>

      <div class="language-options">
        <strong>Show translated comments</strong><br>
        <label><input type="checkbox" class="language-toggle" data-language="EnglishUS"> English (US)</label>
        <label><input type="checkbox" class="language-toggle" data-language="German"> German</label>
        <label><input type="checkbox" class="language-toggle" data-language="French"> French</label>
        <label><input type="checkbox" class="language-toggle" data-language="Italian"> Italian</label>
      </div>

      <div id="EnglishUSSection" class="hidden">
        <h2>English (US) combined comments</h2>
        <textarea id="EnglishUSOutput" readonly></textarea>
        <button onclick="copyText('EnglishUSOutput')">Copy English (US)</button>
      </div>

      <div id="GermanSection" class="hidden">
        <h2>German combined comments</h2>
        <textarea id="GermanOutput" readonly></textarea>
        <button onclick="copyText('GermanOutput')">Copy German</button>
      </div>

      <div id="FrenchSection" class="hidden">
        <h2>French combined comments</h2>
        <textarea id="FrenchOutput" readonly></textarea>
        <button onclick="copyText('FrenchOutput')">Copy French</button>
      </div>

      <div id="ItalianSection" class="hidden">
        <h2>Italian combined comments</h2>
        <textarea id="ItalianOutput" readonly></textarea>
        <button onclick="copyText('ItalianOutput')">Copy Italian</button>
      </div>
    </section>

  </div>

  <script>
    const commentList = document.getElementById("commentList");
    const englishOutput = document.getElementById("englishOutput");
    const searchBox = document.getElementById("searchBox");
    const selectedCount = document.getElementById("selectedCount");
    const warningBox = document.getElementById("warningBox");
    const selectedReview = document.getElementById("selectedReview");

    const languages = ["EnglishUS", "German", "French", "Italian"];

    let comments = [];
    let vessels = [];
    let segments = [];
    let selectedOrder = [];

    Promise.all([
      fetch("comments.csv").then(response => response.text()),
      fetch("vessels.csv").then(response => response.text()),
      fetch("segments.csv").then(response => response.text())
    ])
    .then(([commentsCsv, vesselsCsv, segmentsCsv]) => {
      comments = parseCSV(commentsCsv);
      vessels = parseCSV(vesselsCsv).filter(item => item.English && item.English.trim() !== "");
      segments = parseCSV(segmentsCsv).filter(item => item.English && item.English.trim() !== "");

      populateDatalist("vesselOptions", vessels);
      populateDatalist("segmentOptions", segments);

      buildCommentList(comments);
    })
    .catch(error => {
      commentList.innerHTML = "Could not load comments.csv, vessels.csv or segments.csv. Make sure they are in the same folder as index.html.";
      console.error(error);
    });

    function parseCSV(text) {
      const rows = text.trim().split(/\r?\n/).map(row => parseCSVRow(row));
      const headers = rows.shift();

      return rows.map(row => {
        let item = {};
        headers.forEach((header, index) => {
          item[header.trim()] = row[index] ? row[index].trim() : "";
        });
        return item;
      });
    }

    function parseCSVRow(row) {
      const result = [];
      let current = "";
      let insideQuotes = false;

      for (let i = 0; i < row.length; i++) {
        const char = row[i];
        const nextChar = row[i + 1];

        if (char === '"' && insideQuotes && nextChar === '"') {
          current += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          result.push(current);
          current = "";
        } else {
          current += char;
        }
      }

      result.push(current);
      return result;
    }

    function populateDatalist(id, data) {
      const list = document.getElementById(id);
      list.innerHTML = "";

      data.forEach(item => {
        const option = document.createElement("option");
        option.value = item.English;
        list.appendChild(option);
      });
    }

    function buildCommentList(data) {
      commentList.innerHTML = "";

      let currentCategory = "";
      let currentSubcategory = "";

      data.forEach((comment, index) => {
        if (comment.Category !== currentCategory) {
          currentCategory = comment.Category;
          currentSubcategory = "";

          const categoryHeading = document.createElement("div");
          categoryHeading.className = "category collapsed";
          categoryHeading.textContent = currentCategory || "Uncategorised";

          categoryHeading.addEventListener("click", () => {
            if (searchBox.value.trim()) return;

            const expanding = categoryHeading.classList.contains("collapsed");
            categoryHeading.classList.toggle("collapsed");

            let next = categoryHeading.nextElementSibling;

            while (next && !next.classList.contains("category")) {
              if (expanding) {
                if (next.classList.contains("subcategory")) {
                  next.classList.remove("hidden");
                  next.classList.add("collapsed");
                } else {
                  next.classList.add("hidden");
                }
              } else {
                next.classList.add("hidden");
              }

              next = next.nextElementSibling;
            }
          });

          commentList.appendChild(categoryHeading);
        }

        if (comment.Subcategory !== currentSubcategory) {
          currentSubcategory = comment.Subcategory;

          const subcategoryHeading = document.createElement("div");
          subcategoryHeading.className = "subcategory collapsed hidden";
          subcategoryHeading.textContent = currentSubcategory || "General";

          subcategoryHeading.addEventListener("click", () => {
            if (searchBox.value.trim()) return;

            const expanding = subcategoryHeading.classList.contains("collapsed");
            subcategoryHeading.classList.toggle("collapsed");

            let next = subcategoryHeading.nextElementSibling;

            while (
              next &&
              !next.classList.contains("subcategory") &&
              !next.classList.contains("category")
            ) {
              if (expanding) {
                next.classList.remove("hidden");
              } else {
                next.classList.add("hidden");
              }

              next = next.nextElementSibling;
            }
          });

          commentList.appendChild(subcategoryHeading);
        }

        const item = document.createElement("div");
        item.className = "comment-item hidden";
        item.dataset.index = index;

        item.dataset.searchText = [
          comment.Category,
          comment.Subcategory,
          comment.English,
          comment.EnglishUS,
          comment.German,
          comment.French,
          comment.Italian
        ].join(" ").toLowerCase();

        const header = document.createElement("div");
        header.className = "comment-header";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.dataset.index = index;

        checkbox.addEventListener("change", () => {
          item.classList.toggle("selected", checkbox.checked);

          if (checkbox.checked && !selectedOrder.includes(index)) {
            selectedOrder.push(index);
          }

          if (!checkbox.checked) {
            selectedOrder = selectedOrder.filter(itemIndex => itemIndex !== index);
          }

          updateOutputs();
        });

        const textContainer = document.createElement("div");
        textContainer.className = "comment-text";

        renderCommentWithDropdowns(textContainer, comment.English, index);

        header.appendChild(checkbox);
        header.appendChild(textContainer);
        item.appendChild(header);

        commentList.appendChild(item);
      });
    }

    function renderCommentWithDropdowns(container, text, commentIndex) {
      const parts = String(text || "").split(/(\[vessel\]|\[segment\])/g);

      let vesselNumber = 0;
      let segmentNumber = 0;

      parts.forEach(part => {
        if (part === "[vessel]") {
          const input = createSearchableInput(commentIndex, "vessel", vesselNumber, "vesselOptions", "-- Select vessel --");
          container.appendChild(input);
          vesselNumber++;
        } else if (part === "[segment]") {
          const input = createSearchableInput(commentIndex, "segment", segmentNumber, "segmentOptions", "-- Select segment --");
          container.appendChild(input);
          segmentNumber++;
        } else {
          const span = document.createElement("span");
          span.className = "comment-text-part";
          span.dataset.original = part;
          span.textContent = part;
          container.appendChild(span);
        }
      });
    }

    function createSearchableInput(commentIndex, placeholder, number, listId, label) {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "dropdown-input";
      input.setAttribute("list", listId);
      input.placeholder = label;
      input.dataset.index = commentIndex;
      input.dataset.placeholder = placeholder;
      input.dataset.number = number;

      input.addEventListener("input", () => {
        input.classList.remove("missing-selection");
        updateOutputs();
      });

      return input;
    }

    function findReplacement(type, value) {
      const source = type === "vessel" ? vessels : segments;
      return source.find(item => item.English === value);
    }

    function getEnglishComment(index, requireValidSelections) {
      const comment = comments[index];
      let english = comment.English || "";

      const inputs = document.querySelectorAll(`.dropdown-input[data-index="${index}"]`);

      inputs.forEach(input => {
        const placeholder = "[" + input.dataset.placeholder + "]";
        const replacement = findReplacement(input.dataset.placeholder, input.value);

        if (replacement) {
          english = english.replace(placeholder, replacement.English);
        } else if (!requireValidSelections && input.value) {
          english = english.replace(placeholder, input.value);
        }
      });

      return english;
    }

    function validateSelectedComments() {
      let isValid = true;
      let firstMissing = null;

      document.querySelectorAll(".dropdown-input").forEach(input => {
        const parentComment = input.closest(".comment-item");
        const checkbox = parentComment.querySelector('input[type="checkbox"]');

        if (!checkbox.checked) {
          input.classList.remove("missing-selection");
          return;
        }

        const match = findReplacement(input.dataset.placeholder, input.value);

        if (!input.value || !match) {
          input.classList.add("missing-selection");

          if (!firstMissing) {
            firstMissing = input;
          }

          isValid = false;
        } else {
          input.classList.remove("missing-selection");
        }
      });

      if (!isValid) {
        warningBox.textContent = "Please complete all vessel and segment dropdowns using a valid option before copying.";

        if (firstMissing) {
          firstMissing.focus();
        }
      } else {
        warningBox.textContent = "";
      }

      return isValid;
    }

    function updateOutputs() {
      const selectedBoxes = document.querySelectorAll("input[type='checkbox'][data-index]:checked");

      selectedCount.textContent = "Selected comments: " + selectedBoxes.length;

      const englishComments = [];

      const translatedComments = {
        EnglishUS: [],
        German: [],
        French: [],
        Italian: []
      };

      selectedOrder = selectedOrder.filter(index => {
        const box = document.querySelector(`input[type='checkbox'][data-index="${index}"]`);
        return box && box.checked;
      });

      selectedOrder.forEach(index => {
        const comment = comments[index];

        let english = comment.English || "";

        const languageTexts = {
          EnglishUS: comment.EnglishUS || comment.English || "",
          German: comment.German || comment.English || "",
          French: comment.French || comment.English || "",
          Italian: comment.Italian || comment.English || ""
        };

        const inputs = document.querySelectorAll(`.dropdown-input[data-index="${index}"]`);
        let commentHasMissingSelection = false;

        inputs.forEach(input => {
          const replacement = findReplacement(input.dataset.placeholder, input.value);

          if (!input.value || !replacement) {
            commentHasMissingSelection = true;
            return;
          }

          const placeholder = "[" + input.dataset.placeholder + "]";

          english = english.replace(placeholder, replacement.English);
          languageTexts.EnglishUS = languageTexts.EnglishUS.replace(placeholder, replacement.EnglishUS || replacement.English);
          languageTexts.German = languageTexts.German.replace(placeholder, replacement.German || replacement.English);
          languageTexts.French = languageTexts.French.replace(placeholder, replacement.French || replacement.English);
          languageTexts.Italian = languageTexts.Italian.replace(placeholder, replacement.Italian || replacement.English);
        });

        if (!commentHasMissingSelection) {
          englishComments.push(english);

          languages.forEach(language => {
            translatedComments[language].push(languageTexts[language]);
          });
        }
      });

      englishOutput.value = englishComments.join("\n");

      languages.forEach(language => {
        document.getElementById(language + "Output").value =
          translatedComments[language].join("\n");
      });

      updateSelectedReview();
    }

    function updateSelectedReview() {
      selectedReview.innerHTML = "";

      if (selectedOrder.length === 0) {
        selectedReview.textContent = "No comments selected.";
        return;
      }

      selectedOrder.forEach(index => {
        const row = document.createElement("div");
        row.className = "selected-review-item";
        row.draggable = true;
        row.dataset.index = index;

        const handle = document.createElement("strong");
        handle.textContent = "☰";

        const text = document.createElement("span");
        text.textContent = getEnglishComment(index, false);

        const remove = document.createElement("button");
        remove.className = "remove-selected";
        remove.textContent = "×";

        remove.addEventListener("click", () => {
          const box = document.querySelector(`input[type='checkbox'][data-index="${index}"]`);
          const item = document.querySelector(`.comment-item[data-index="${index}"]`);

          if (box) box.checked = false;
          if (item) item.classList.remove("selected");

          selectedOrder = selectedOrder.filter(itemIndex => itemIndex !== index);
          updateOutputs();
        });

        row.addEventListener("dragstart", event => {
          event.dataTransfer.setData("text/plain", index);
        });

        row.addEventListener("dragover", event => {
          event.preventDefault();
        });

        row.addEventListener("drop", event => {
          event.preventDefault();

          const draggedIndex = Number(event.dataTransfer.getData("text/plain"));
          const droppedIndex = Number(row.dataset.index);

          const from = selectedOrder.indexOf(draggedIndex);
          const to = selectedOrder.indexOf(droppedIndex);

          if (from > -1 && to > -1) {
            selectedOrder.splice(from, 1);
            selectedOrder.splice(to, 0, draggedIndex);
            updateOutputs();
          }
        });

        row.appendChild(handle);
        row.appendChild(text);
        row.appendChild(remove);

        selectedReview.appendChild(row);
      });
    }

    searchBox.addEventListener("input", () => {
      const searchTerm = searchBox.value.toLowerCase().trim();

      clearHighlights();

      document.querySelectorAll(".comment-item").forEach(item => {
        item.style.display = "block";
      });

      if (!searchTerm) {
        document.querySelectorAll(".subcategory, .comment-item").forEach(element => {
          element.classList.add("hidden");
        });

        document.querySelectorAll(".category, .subcategory").forEach(element => {
          element.classList.add("collapsed");
        });

        document.querySelectorAll(".category").forEach(element => {
          element.classList.remove("hidden");
        });

        return;
      }

      document.querySelectorAll(".category, .subcategory, .comment-item").forEach(element => {
        element.classList.add("hidden");
      });

      document.querySelectorAll(".comment-item").forEach(item => {
        const matches = item.dataset.searchText.includes(searchTerm);

        if (matches) {
          item.classList.remove("hidden");
          item.style.display = "block";

          showParentHeadings(item);
          highlightText(item, searchTerm);
        }
      });
    });

    function showParentHeadings(item) {
      let previous = item.previousElementSibling;

      while (previous) {
        if (previous.classList.contains("subcategory")) {
          previous.classList.remove("hidden");
          previous.classList.remove("collapsed");
          break;
        }

        previous = previous.previousElementSibling;
      }

      previous = item.previousElementSibling;

      while (previous) {
        if (previous.classList.contains("category")) {
          previous.classList.remove("hidden");
          previous.classList.remove("collapsed");
          break;
        }

        previous = previous.previousElementSibling;
      }
    }

    function highlightText(item, term) {
      const regex = new RegExp("(" + escapeRegExp(term) + ")", "gi");

      item.querySelectorAll(".comment-text-part").forEach(span => {
        const original = span.dataset.original || "";
        span.innerHTML = escapeHTML(original).replace(regex, "<mark>$1</mark>");
      });
    }

    function clearHighlights() {
      document.querySelectorAll(".comment-text-part").forEach(span => {
        span.textContent = span.dataset.original || "";
      });
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function escapeHTML(string) {
      return string
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    document.querySelectorAll(".language-toggle").forEach(toggle => {
      toggle.addEventListener("change", () => {
        const language = toggle.dataset.language;
        const section = document.getElementById(language + "Section");
        section.classList.toggle("hidden", !toggle.checked);
      });
    });

    function copyText(id) {
      if (!validateSelectedComments()) {
        return;
      }

      updateOutputs();

      const textBox = document.getElementById(id);
      textBox.select();
      navigator.clipboard.writeText(textBox.value);
    }
  </script>

</body>
</html>
